name: BreeAI CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: breeai-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests and syntax check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: breeai/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: breeai/backend/requirements*.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Compile Python source
        run: python -m compileall -q app tests
      - name: Run backend tests
        run: pytest -q

  android-build:
    name: Android debug build and lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36,build-tools;36.0.0'
      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Generate Gradle Wrapper
        working-directory: breeai/android
        run: gradle wrapper --gradle-version 9.6.0 --distribution-type bin
      - name: Build, unit test, and lint
        working-directory: breeai/android
        run: ./gradlew --no-daemon clean testDebugUnitTest assembleDebug lintDebug
      - name: Upload debug APK (only after successful build)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: breeai-debug-apk
          path: breeai/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Write build summary
        if: always()
        run: |
          echo '## Bree AI Android build' >> "$GITHUB_STEP_SUMMARY"
          echo "- Source commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Result: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f breeai/android/app/build/outputs/apk/debug/app-debug.apk ]; then
            echo '- APK file exists and was eligible for artifact upload.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '- APK not found; inspect build logs.' >> "$GITHUB_STEP_SUMMARY"
          fi
